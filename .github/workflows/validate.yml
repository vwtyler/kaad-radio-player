name: Validate WordPress plugin

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: php -l kaad-radio-player.php
      - name: Test stream URLs
        run: php tests/stream-url-test.php
